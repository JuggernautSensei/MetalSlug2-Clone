할 때 사용된다. 

AABB 를 이용하여 계산하기 때문에 충돌검사가 저렴하다.

사선이나 곡선바닥의 경우 aabb 충돌로 해결이 불가하고
부드러운 이동감을 줘야하기 때문에
픽셀을 이용하여 충돌검사를 한다. 이는 나중에 한 번더 살펴보도록 한다.

