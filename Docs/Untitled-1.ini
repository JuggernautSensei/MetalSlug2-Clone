---
애니메이션 에디터

메탈슬러그는 방대한 스프라이트로 이루어져 있기에 
리소스에 대한 작업. 보일러 플레이트가 어마 무시하다. (스프라이트 시트를 보여주며)

애니메이션 에디터에서는 미리 작업해 놓은 스프라이트 시트를 불러와
자연스럽게 편집하는 작업을 할 수 있다.

어니언 프레임을 제공하기에 직전 프레임을 반투명 이미지로 참조할 수 있고
자연스럽게 조절이 가능하다.

픽셀 게임인지라 한픽셀 한픽셀이 플레잉어의 경험에 큰 영향을 미치기 때문에
에디터로 세밀하게 위치를 조절하고
애니메이션의 속도를 조절하는 등의 편집을 할 수 있다.

---
맵 에디터

플레이 영상에서 봤듯
게임 장면을 구성하는데는 어마무시한 오브젝트가 존재한다.
그래서 직접 몬스터를 배치하고, 시각적으로 섹터를 나누고, 이벤트를 발생시키는 구조가
필요했다.

맵 에디터에서는 오브젝트를 배치할 수 있고
섹터의 위치를 조절할 수 있고
카메라 위치를 고정하는 지점을 정할 수 있다.

플레이에서 본
특정 구역에서 우수수 나오는 적들
특정 위치에 소환되는 탱크, 헬기
플레이어의 총알에 의해 펑펑 터지는 나무 구조물 등
전부 에디터에서 편집할 수 있다.

---
픽셀 에디터

런타임에선 보이지 픽셀이 자연스러운 사선/곡선 충돌을 구현한다.
OBB 충돌체를 쓰는 방법도 있긴 하지만 복잡도를 고려하면 픽셀 충돌체가 더 우월하다.

플레이어의 발 쯤에있는 픽셀을 가져와서
흰색인지 파란색인지 판단하여 충돌을 처리한다.

보이지 않는 픽셀과 보이는 맵 간의 동기화가 상당히 중요한 부분인데,
픽셀 에디터를 이용해 픽셀을 실제로 그리고 편집하는 방식을 선택했다.

맵위에 대고 그리는 방식이기 때문에 정확하게 픽셀 충돌체를 구성할 수 있다.

---
게임 플레이 에디터

오브젝트들의 히트박스, 투사체 발사 위치, 자식 오브젝트 위치, 몬스터 패턴 등
모든 것을 데이터 지향 설계를 했고, 직렬화 및 역직렬화 할 수 있다.

그래서 에디터를 통해 조절한 수치는 즉시 런타임에 반영된다.

메탈슬러그의 경우 오브젝트가 모델별로 세세하게 분리되어있기 때문에
이런 세세한 편집이 가능한 기능을 필수였다.

더하여, 몬스터의 충돌체를 추가하고 조절하고 배치하는 작업도 가능하며
해당 패턴에 던질 투사체의 수, 폭발의 크기, 위치, 간격등도
슬라이더를 통해 즉시 조절이 가능하다.

---
마무리.

JugX와 AI 사용에 대한 이야기는 딱히 넣지 않아도 될듯

본 작품은 2024.02.05 부터 2달간 제작했고
2026.10.09 부터 1주일간 AI와 함께 리메이크를 거쳐 완성한 모작이다.

바닥부터 손수 게임을 개발해보면서
C++, 객체, 데이터지향설계, 직렬화와 역직렬화, 그래픽스 역량이 크게 늘었다고 느낀다.

또, AI를 접목시켜 구조를 파악하고 하네스를 설계하는 경험도 해보았다.
AI가 원하는대로 코드를 안짜줘서. 통으로 커밋을 되돌렸던 경험
그로인해 문제 해결에 있어 어떻게 하네스를 설계해야하는지.
또, 어떤 식으로 해야 AI가 내가 원하는 작업을 해주는지 습득할 수 있는 
소중한 기회가 되았다.

전부 처음이었지만
이렇게 부딪히는 경험을 통해서
기초적인 역량을 단련할 수 있었다는 점에서 
나한테는 다양한 능력을 발전시킬 수 있는 경험이었다는 점에서 의의가 있다.
