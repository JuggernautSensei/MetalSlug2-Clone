<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <!-- generated by build.py from script.json; edit template.html / script.json instead -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Malgun";
        src: url("assets/fonts/malgun.ttf") format("truetype");
        font-weight: 400;
      }
      @font-face {
        font-family: "Malgun";
        src: url("assets/fonts/malgunbd.ttf") format("truetype");
        font-weight: 700;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #121722;
      }
      #root {
        --accent: #3ddbb4;
        --accent-deep: #4fbfa3;
        --accent-wipe: linear-gradient(100deg, #22b892 0%, #8ff0d6 100%);
        --accent-glow: rgba(61, 219, 180, 0.14);
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Malgun", sans-serif;
        color: #f2f4f8;
      }
      .bg {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(900px 520px at 88% 6%, var(--accent-glow), transparent 70%),
          radial-gradient(1100px 700px at 8% 100%, rgba(70, 100, 170, 0.22), transparent 70%),
          linear-gradient(160deg, #1d2536 0%, #151b28 55%, #10141d 100%);
      }
      .clip {
        position: absolute;
        inset: 0;
      }
      .wrap {
        position: absolute;
        inset: 0;
      }
      .media {
        object-fit: cover;
        inset: auto;
      }
      .hl {
        color: var(--accent);
      }

      .scene-title {
        position: absolute;
        left: 72px;
        top: 44px;
        padding-left: 22px;
        border-left: 5px solid var(--accent);
      }
      .scene-title h2 {
        font-size: 40px;
        font-weight: 700;
        line-height: 1.2;
      }
      .scene-title p {
        margin-top: 4px;
        font-size: 22px;
        color: #8d97ab;
      }
      .badge {
        position: absolute;
        right: 72px;
        top: 52px;
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 22px;
        color: #aeb6c6;
      }
      .badge b {
        display: inline-block;
        padding: 3px 10px;
        border-radius: 6px;
        background: var(--accent);
        color: #141924;
        font-weight: 700;
      }
      .media-card {
        position: absolute;
        border-radius: 18px;
        background: #0c1018;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
      }
      .pbadge {
        position: absolute;
        right: 14px;
        top: 40px;
        padding: 6px 10px;
        white-space: nowrap;
        border-radius: 8px;
        background: rgba(16, 20, 29, 0.72);
        font-size: 20px;
        text-align: center;
        color: #f2f4f8;
      }

      /* chapter */
      .ch-num {
        position: absolute;
        left: 160px;
        top: 330px;
        font-size: 260px;
        font-weight: 700;
        color: var(--accent-deep);
        line-height: 1;
      }
      .ch-name {
        position: absolute;
        left: 172px;
        top: 620px;
        font-size: 64px;
        font-weight: 700;
      }
      .ch-sub {
        position: absolute;
        left: 176px;
        top: 712px;
        font-size: 28px;
        color: #8d97ab;
      }
      .wipe {
        position: absolute;
        top: -10%;
        left: 0;
        width: 1500px;
        height: 120%;
        background: var(--accent-wipe);
      }

      /* trailer cards (R3) */
      .tcard {
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .tcard-in {
        text-align: center;
        text-shadow: 0 2px 18px rgba(0, 0, 0, 0.85);
      }
      .tcard-in p {
        font-size: 32px;
        color: #f2f4f8;
      }
      .tcard-in h3 {
        margin-top: 6px;
        font-family: Consolas, monospace;
        font-size: 84px;
        font-weight: 400;
        letter-spacing: 0.18em;
        color: #ffffff;
      }
      .title-card {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 22px;
      }
      .title-card h1 {
        font-family: Consolas, monospace;
        font-size: 96px;
        font-weight: 400;
        color: var(--accent);
      }
      .title-card p {
        font-size: 32px;
        color: #aeb6c6;
      }

      /* concept: layers */
      .layer-card {
        position: absolute;
        left: 410px;
        top: 190px;
        width: 1100px;
        height: 560px;
        border-radius: 18px;
        overflow: hidden;
        background: #0c1018;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
      }
      .layer-card img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
      }
      .layer-tags {
        position: absolute;
        left: 410px;
        top: 778px;
        width: 1100px;
        display: flex;
        gap: 28px;
        font-size: 24px;
      }
      .tag {
        display: flex;
        align-items: center;
        gap: 12px;
        color: #aeb6c6;
      }
      .tag i {
        display: inline-block;
        width: 20px;
        height: 20px;
        border-radius: 4px;
      }
      .tag code {
        font-family: Consolas, monospace;
        color: #f2f4f8;
      }

      /* concept: boss parts */
      .parts {
        position: absolute;
        left: 360px;
        top: 200px;
        width: 1200px;
        height: 640px;
      }
      .part {
        position: absolute;
        display: flex;
        justify-content: center;
        align-items: center;
        border: 2px dashed var(--accent);
        border-radius: 14px;
        background: rgba(61, 219, 180, 0.08);
        font-size: 30px;
        font-weight: 700;
      }
      .hull {
        left: 0;
        top: 300px;
        width: 760px;
        height: 300px;
      }
      .ant {
        left: 40px;
        top: 80px;
        width: 220px;
        height: 180px;
      }
      .cannon {
        left: 800px;
        top: 380px;
        width: 400px;
        height: 220px;
      }
      .turrets {
        position: absolute;
        left: 300px;
        top: 80px;
        width: 900px;
        height: 180px;
        display: flex;
        gap: 14px;
      }
      .turret {
        position: relative;
        flex: 1;
        height: 180px;
        font-size: 22px;
        border-color: #eb4050;
        background: rgba(235, 64, 80, 0.1);
      }

      /* statement (R6) */
      .st-label {
        position: absolute;
        left: 160px;
        top: 380px;
        font-size: 30px;
        color: #8d97ab;
      }
      .st-title {
        position: absolute;
        left: 156px;
        top: 432px;
        font-size: 96px;
        font-weight: 700;
        line-height: 1.22;
      }
      .st-title > span {
        display: block;
      }

      /* captions (R4) */
      .cap {
        top: 960px;
        bottom: auto;
        height: 60px;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .cap p {
        font-size: 38px;
        font-weight: 700;
        color: #ffffff;
        text-shadow:
          0 2px 6px rgba(0, 0, 0, 0.75),
          0 0 2px rgba(0, 0, 0, 0.9);
      }
      .cap.band p {
        padding: 6px 22px;
        border-radius: 6px;
        background: rgba(10, 13, 20, 0.62);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="{{DURATION}}"
      data-width="1920"
      data-height="1080"
    >
      <div class="bg"></div>
      {{ELEMENTS}}
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      {{TWEENS}}
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
