<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Malgun"; src: url("assets/fonts/malgun.ttf") format("truetype"); font-weight: 400; }
      @font-face { font-family: "Malgun"; src: url("assets/fonts/malgunbd.ttf") format("truetype"); font-weight: 700; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #root { --accent: #3ddbb4; position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Malgun", sans-serif; color: #f2f4f8; background: #000; }
      .clip { position: absolute; inset: 0; }

      .shot, .layer { position: absolute; inset: 0; }
      .shot { overflow: hidden; filter: url("#whip-blur"); will-change: transform, filter; }
      .shot video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

      #title-bg video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .scrim { position: absolute; inset: 0; background: radial-gradient(1400px 900px at 50% 45%, rgba(10, 13, 20, 0.5), rgba(8, 10, 16, 0.84)); }
      .title-box { position: absolute; left: 0; right: 0; top: 340px; text-align: center; }
      .acrylic {
        display: inline-block; padding: 54px 96px 50px; border-radius: 28px;
        background: rgba(20, 26, 38, 0.42); border: 1px solid rgba(255, 255, 255, 0.14);
        box-shadow: 0 40px 120px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      }
      .title { font-size: 150px; font-weight: 700; line-height: 1; letter-spacing: -2px; }
      .title span { display: inline-block; }
      .title .hl { color: var(--accent); }
      .sub { margin-top: 52px; font-size: 40px; color: #d5dbe6; }
      #black { background: #000; }

      #notice { display: flex; align-items: center; justify-content: center; }
      #notice p { font-size: 34px; color: #c9d0dc; letter-spacing: 0.5px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="28.9" data-width="1920" data-height="1080">
      <svg width="0" height="0" aria-hidden="true" style="position: absolute">
        <defs>
          <filter id="whip-blur" x="-20%" y="0%" width="140%" height="100%">
            <feGaussianBlur id="whip-blur-node" in="SourceGraphic" stdDeviation="0 0" />
          </filter>
        </defs>
      </svg>

      <!-- 하이라이트 몽타주: 컷 1.8초 + 0.32초 꼬리(전환 겹침). 뒤에 오는 컷이 위에 그려진다. -->
      <div id="shot0" class="shot"><video id="v0" class="clip" data-track-index="0" src="assets/shot0.mp4" muted playsinline data-start="0" data-duration="2.12"></video></div>
      <div id="shot1" class="shot"><video id="v1" class="clip" data-track-index="1" src="assets/shot1.mp4" muted playsinline data-start="1.8" data-duration="2.12"></video></div>
      <div id="shot2" class="shot"><video id="v2" class="clip" data-track-index="0" src="assets/shot2.mp4" muted playsinline data-start="3.6" data-duration="2.12"></video></div>
      <div id="shot3" class="shot"><video id="v3" class="clip" data-track-index="1" src="assets/shot3.mp4" muted playsinline data-start="5.4" data-duration="2.12"></video></div>
      <div id="shot4" class="shot"><video id="v4" class="clip" data-track-index="0" src="assets/shot4.mp4" muted playsinline data-start="7.2" data-duration="2.12"></video></div>
      <div id="shot5" class="shot"><video id="v5" class="clip" data-track-index="1" src="assets/shot5.mp4" muted playsinline data-start="9" data-duration="2.12"></video></div>
      <div id="shot6" class="shot"><video id="v6" class="clip" data-track-index="0" src="assets/shot6.mp4" muted playsinline data-start="10.8" data-duration="2.12"></video></div>
      <div id="shot7" class="shot"><video id="v7" class="clip" data-track-index="1" src="assets/shot7.mp4" muted playsinline data-start="12.6" data-duration="2.12"></video></div>
      <div id="shot8" class="shot"><video id="v8" class="clip" data-track-index="0" src="assets/shot8.mp4" muted playsinline data-start="14.4" data-duration="2.12"></video></div>
      <div id="shot9" class="shot"><video id="v9" class="clip" data-track-index="1" src="assets/shot9.mp4" muted playsinline data-start="16.2" data-duration="3.1"></video></div>

      <!-- 타이틀: 같은 장면이 흐려지며(포커스 풀) 아크릴 판이 올라온다 -->
      <div id="title-bg" class="layer"><video id="vbg" class="clip" data-track-index="2" src="assets/title_bg.mp4" muted playsinline data-start="18.6" data-duration="6"></video></div>
      <div id="title" class="clip" data-start="18.6" data-duration="6" data-track-index="3">
        <div class="scrim"></div>
        <div class="title-box">
          <div class="acrylic" id="panel">
            <div class="title"><span id="t1">MetalSlug2</span> <span id="t2" class="hl">Clone</span></div>
            <div class="sub" id="sub">C++ 자체 엔진으로 제작한 메탈슬러그 2 클론 코딩</div>
          </div>
        </div>
      </div>
      <div id="black" class="clip" data-start="24.1" data-duration="4.8" data-track-index="4"></div>
      <div id="notice" class="clip" data-start="24.6" data-duration="4.3" data-track-index="5">
        <p id="notice-text">이 작품은 학습 목적으로 메탈슬러그 2를 모작한 작품입니다.</p>
      </div>

      <audio id="bgm" src="assets/bgm_intro.wav" data-start="0" data-duration="28.9" data-volume="0.9" data-fade-in="0.3" data-fade-out="2"></audio>
      <audio id="whoosh1" src="assets/whoosh.wav" data-start="3.5" data-duration="0.42" data-volume="0.3"></audio>
      <audio id="whoosh2" src="assets/whoosh.wav" data-start="8.9" data-duration="0.42" data-volume="0.3"></audio>
      <audio id="whoosh3" src="assets/whoosh.wav" data-start="14.3" data-duration="0.42" data-volume="0.3"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const W = 0.32;
      const FADE = 0.4;
      const D = 1.8;
      const PEAK_BLUR = 16;
      const blurNode = document.getElementById("whip-blur-node");
      const blur = { v: 0 };
      const writeBlur = () => blurNode.setAttribute("stdDeviation", blur.v + " 0");
      writeBlur();

      // 컷 i로 들어올 때의 전환. cut은 아무것도 하지 않는다(뒤 컷이 위에 그려지므로 즉시 바뀐다).
      const transitions = ["", "cut", "whip", "cut", "fade", "whip", "cut", "fade", "whip", "fade"];
      transitions.forEach((kind, i) => {
        const at = i * D;
        if (kind === "whip") {
          tl.fromTo(`#shot${i - 1}`, { x: 0 }, { x: -1920, duration: W, ease: "power3.inOut", immediateRender: false }, at);
          tl.fromTo(`#shot${i}`, { x: 1920 }, { x: 0, duration: W, ease: "power3.inOut" }, at);
          tl.to(blur, { v: PEAK_BLUR, duration: W / 2, ease: "power3.in", onUpdate: writeBlur }, at);
          tl.to(blur, { v: 0, duration: W / 2, ease: "power3.out", onUpdate: writeBlur }, at + W / 2);
        } else if (kind === "fade") {
          tl.fromTo(`#shot${i}`, { opacity: 0 }, { opacity: 1, duration: FADE, ease: "power1.inOut" }, at);
        }
      });

      // 포커스 풀 → 아크릴 타이틀
      tl.fromTo("#title-bg", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power1.inOut" }, 18.6);
      tl.fromTo(".scrim", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 18.7);
      tl.fromTo("#panel", { opacity: 0, scale: 0.94, y: 24 }, { opacity: 1, scale: 1, y: 0, duration: 0.7, ease: "power3.out" }, 19.0);
      tl.fromTo("#t1", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 19.15);
      tl.fromTo("#t2", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 19.3);
      tl.fromTo("#sub", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 19.65);
      tl.to("#panel", { opacity: 0, scale: 0.98, duration: 0.4, ease: "power2.in" }, 24.0);

      // 검은 화면 → 학습 목적 고지
      tl.fromTo("#black", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 24.1);
      tl.fromTo("#notice-text", { opacity: 0 }, { opacity: 1, duration: 0.45 }, 24.7);
      tl.to("#notice-text", { opacity: 0, duration: 0.45 }, 28.1);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
