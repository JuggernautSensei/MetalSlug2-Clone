<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <!-- build.py가 captions.json으로 index.html을 만든다. 스타일은 여기서 고친다. -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Malgun"; src: url("assets/fonts/malgun.ttf") format("truetype"); font-weight: 400; }
      @font-face { font-family: "Malgun"; src: url("assets/fonts/malgunbd.ttf") format("truetype"); font-weight: 700; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #root { --accent: #3ddbb4; position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Malgun", sans-serif; color: #f2f4f8; background: #000; }
      .clip { position: absolute; inset: 0; }
      .layer { position: absolute; inset: 0; }

      .side { position: absolute; inset: 0; width: 1920px; height: 1080px; object-fit: cover; }
      .side-dim { position: absolute; inset: 0; background: rgba(8, 10, 16, 0.55); }
      .game { position: absolute; left: {{GAME_LEFT}}px; top: 0; width: 1542px; height: 1080px; box-shadow: 0 0 80px rgba(0, 0, 0, 0.6); }

      #chapter .scrim { position: absolute; inset: 0; background: radial-gradient(1400px 900px at 50% 45%, rgba(10, 13, 20, 0.45), rgba(8, 10, 16, 0.85)); }
      #chapter .box { position: absolute; left: 0; right: 0; top: 400px; text-align: center; }
      .acrylic {
        display: inline-block; padding: 50px 110px 54px; border-radius: 28px;
        background: rgba(20, 26, 38, 0.42); border: 1px solid rgba(255, 255, 255, 0.14);
        box-shadow: 0 40px 120px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      }
      #chapter h1 { font-size: 120px; font-weight: 700; letter-spacing: -1px; line-height: 1.1; }
      #chapter h1 span { color: var(--accent); }

      .cap { display: flex; align-items: flex-end; justify-content: center; padding-bottom: 58px; }
      .cap p {
        max-width: 1440px; padding: 14px 30px 16px; border-radius: 16px;
        background: rgba(12, 16, 25, 0.74); border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
        font-size: 38px; font-weight: 700; line-height: 1.38; text-align: center; color: #f4f6fa;
        word-break: keep-all;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{END}}" data-width="1920" data-height="1080">
      <!-- 타이틀 정지 화면: 원본 타이틀 프레임을 늘려 메인 화면을 길게 보여준다 -->
      <div id="freeze" class="clip" data-start="{{FREEZE_START}}" data-duration="{{FREEZE_LEN}}" data-track-index="0">
        <img class="side" src="assets/title_blur.png" alt="" />
        <div class="side-dim"></div>
        <img class="game" src="assets/title.png" alt="" />
      </div>

      <!-- 원테이크 플레이 (원본 소리 그대로) -->
      <div class="layer"><video id="side" class="clip side" data-track-index="1" src="assets/side_blur.mp4" muted playsinline data-start="{{PLAY_START}}" data-duration="{{PLAY_LEN}}"></video></div>
      <div id="dim" class="clip side-dim" data-start="{{PLAY_START}}" data-duration="{{PLAY_LEN}}" data-track-index="2"></div>
      <div class="layer"><video id="play" class="clip game" data-track-index="3" src="assets/play.mp4" data-has-audio="true" playsinline data-start="{{PLAY_START}}" data-duration="{{PLAY_LEN}}" data-fade-out="2"></video></div>

      <!-- 챕터 카드 -->
      <div id="chapter" class="clip" data-start="0" data-duration="{{CHAPTER}}" data-track-index="4">
        <img class="side" src="assets/title_blur.png" alt="" />
        <div class="scrim"></div>
        <div class="box"><div class="acrylic" id="ch-panel"><h1>게임 <span>플레이</span></h1></div></div>
      </div>


{{CAPTIONS}}
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.fromTo("#ch-panel", { opacity: 0, scale: 0.94, y: 24 }, { opacity: 1, scale: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.2);
      tl.to("#chapter", { opacity: 0, duration: 0.4, ease: "power1.in" }, {{CHAPTER}} - 0.4);
      tl.to(["#play", "#side", "#dim"], { opacity: 0, duration: 1.5, ease: "power1.in" }, {{END}} - 1.5);

      [{{CAP_TIMES}}].forEach(([start, dur], i) => {
        const el = `#c${i}p`;
        tl.fromTo(el, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.22, ease: "power2.out" }, start);
        tl.to(el, { opacity: 0, duration: 0.2, ease: "power1.in" }, start + dur - 0.2);
      });

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
