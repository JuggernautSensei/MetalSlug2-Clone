<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <!-- build.py가 index.html을 만든다. 스타일은 여기서 고친다. -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Malgun"; src: url("assets/fonts/malgun.ttf") format("truetype"); font-weight: 400; }
      @font-face { font-family: "Malgun"; src: url("assets/fonts/malgunbd.ttf") format("truetype"); font-weight: 700; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #root { --accent: #3ddbb4; position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Malgun", sans-serif; color: #f2f4f8; background: #0d1018; }
      .clip { position: absolute; inset: 0; }
      .bg { position: absolute; inset: 0; width: 1920px; height: 1080px; object-fit: cover; }
      .scrim { position: absolute; inset: 0; background: radial-gradient(1500px 950px at 50% 45%, rgba(10, 13, 20, 0.55), rgba(8, 10, 16, 0.86)); }

      .sec { position: absolute; inset: 0; filter: url("#whip-blur"); will-change: transform, filter; }
      .scene-title { position: absolute; left: 72px; top: 44px; padding-left: 22px; border-left: 5px solid var(--accent); font-size: 40px; font-weight: 700; line-height: 1.2; }

      .card { position: absolute; border-radius: 18px; overflow: hidden; background: #0c1018; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55); border: 1px solid rgba(255, 255, 255, 0.1); }
      .card video, .cell video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .hint { position: absolute; border: 3px solid var(--accent); border-radius: 8px; box-shadow: 0 0 18px rgba(61, 219, 180, 0.6); opacity: 0; }
      .toolbar { position: absolute; left: 200px; top: 420px; width: 1520px; height: 56px; border-radius: 10px; overflow: hidden; box-shadow: 0 0 0 3px rgba(61, 219, 180, 0.7), 0 30px 80px rgba(0, 0, 0, 0.55); }
      .toolbar video { position: absolute; inset: 0; width: 100%; height: 100%; }

      .grid { position: absolute; left: 72px; top: 132px; width: 1776px; height: 770px; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 28px; }
      .cell { position: relative; border-radius: 18px; overflow: hidden; background: #0c1018; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5); }
      .cell .label { position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 22px 14px; background: linear-gradient(to top, rgba(8, 10, 16, 0.94) 55%, rgba(8, 10, 16, 0)); font-size: 30px; font-weight: 700; }
      .cell .label b { color: var(--accent); margin-right: 10px; }

      .atlas-row { position: absolute; left: 100px; top: 230px; width: 1720px; display: flex; gap: 40px; }
      .atlas { width: 400px; height: 400px; border-radius: 14px; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.12); }

      .layers { position: absolute; left: 100px; top: 250px; width: 1720px; display: flex; gap: 40px; }
      .layers figure { width: 840px; }
      .layers img { width: 840px; height: 428px; border-radius: 14px; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5); image-rendering: pixelated; display: block; }
      .layers figcaption { margin-top: 14px; font-size: 28px; font-weight: 700; color: #d5dbe6; text-align: center; }

      #chapter .box { position: absolute; left: 0; right: 0; top: 400px; text-align: center; }
      .acrylic {
        display: inline-block; padding: 50px 110px 54px; border-radius: 28px;
        background: rgba(20, 26, 38, 0.42); border: 1px solid rgba(255, 255, 255, 0.14);
        box-shadow: 0 40px 120px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      }
      #chapter h1 { font-size: 120px; font-weight: 700; letter-spacing: -1px; line-height: 1.1; }
      #chapter h1 span { color: var(--accent); }

      .cap { display: flex; align-items: flex-end; justify-content: center; padding-bottom: 50px; }
      .cap p {
        max-width: 1500px; padding: 14px 30px 16px; border-radius: 16px;
        background: rgba(12, 16, 25, 0.8); border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
        font-size: 36px; font-weight: 700; line-height: 1.38; text-align: center; color: #f4f6fa; word-break: keep-all;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{END}}" data-width="1920" data-height="1080">
      <svg width="0" height="0" aria-hidden="true" style="position: absolute">
        <defs>
          <filter id="whip-blur" x="-20%" y="0%" width="140%" height="100%">
            <feGaussianBlur id="whip-blur-node" in="SourceGraphic" stdDeviation="0 0" />
          </filter>
        </defs>
      </svg>
      <img class="bg" src="assets/bg_blur.jpg" alt="" />
      <div class="scrim"></div>

{{SECTIONS}}

      <div id="chapter" class="clip" data-start="0" data-duration="3.2" data-track-index="4">
        <div class="box"><div class="acrylic" id="ch-panel"><h1>디버그 / <span>에디터</span></h1></div></div>
      </div>

{{CAPTIONS}}

      <audio id="bgm" src="assets/bgm_editor.wav" data-start="0" data-duration="{{END}}" data-volume="0.7" data-fade-in="1" data-fade-out="2.5"></audio>
{{WHOOSH}}
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const W = 0.45;
      const PEAK_BLUR = 16;
      const blurNode = document.getElementById("whip-blur-node");
      const blur = { v: 0 };
      const writeBlur = () => blurNode.setAttribute("stdDeviation", blur.v + " 0");
      writeBlur();

      const sections = [{{SEC_TIMES}}];
      const secEnds = sections.map((s) => s[2]);
      gsap.set(sections.map((s) => s[0]), { autoAlpha: 0 });
      sections.forEach(([id, start, end], i) => {
        if (i < 2) {
          tl.fromTo(id, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.4, immediateRender: false }, start);
        } else {
          // 휙: 이전 섹션은 왼쪽으로 나가고 새 섹션이 오른쪽에서 같은 속도로 들어온다
          const prev = sections[i - 1][0];
          tl.set(id, { autoAlpha: 1, x: 1920 }, start);
          tl.to(prev, { x: -1920, duration: W, ease: "power3.inOut" }, start);
          tl.to(id, { x: 0, duration: W, ease: "power3.inOut" }, start);
          tl.to(blur, { v: PEAK_BLUR, duration: W / 2, ease: "power3.in", onUpdate: writeBlur }, start);
          tl.to(blur, { v: 0, duration: W / 2, ease: "power3.out", onUpdate: writeBlur }, start + W / 2);
          tl.set(prev, { autoAlpha: 0 }, start + W);
        }
        if (i === 1) tl.set(sections[0][0], { autoAlpha: 0 }, start + 0.4);
        tl.fromTo(`${id}_t`, { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, start + 0.1);
      });

      function cardIn(sel, a, b) {
        tl.fromTo(sel, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, a);
        if (!secEnds.some((e) => Math.abs(e - b) < 0.05)) tl.to(sel, { opacity: 0, duration: 0.3 }, b - 0.3);
      }

      tl.fromTo("#ch-panel", { opacity: 0, scale: 0.94, y: 24 }, { opacity: 1, scale: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.2);
      tl.to("#chapter", { opacity: 0, duration: 0.4 }, 2.8);

      {{EXTRA_JS}}

      tl.to(".sec, .bg, .scrim", { opacity: 0, duration: 1.5, ease: "power1.in" }, {{END}} - 1.5);

      [{{CAP_TIMES}}].forEach(([start, dur], i) => {
        const el = `#c${i}p`;
        tl.fromTo(el, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.22, ease: "power2.out" }, start);
        tl.to(el, { opacity: 0, duration: 0.2, ease: "power1.in" }, start + dur - 0.2);
      });

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
